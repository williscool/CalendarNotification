# about runners https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
name: CNPlus CI (Android) App Build

env:
  # The name of the main module repository
  main_project_module: app

  # The name of the Play Store
  app_name: "Calendar Notifications Plus"

  app_file_name_prefix: "calendar_notifications_plus"

  # Explicitly set CI flag to true for our Gradle task
  CI: true

  # Pull requests build only the debug APK and the emulator test APK.
  # Release APKs and AABs are built and signed only for tags and manual runs.
  BUILD_RELEASE: ${{ github.event_name != 'pull_request' }}

  # Android Emulator Configuration
  ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 5
  ANDROID_API_LEVEL: 34
  ANDROID_TARGET: google_apis
  ANDROID_ARCH: x86_64
  ANDROID_PROFILE: Nexus 5X  # Light profile for CI stability (foldable was too resource-heavy)
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_EMULATOR_MEMORY: 4096  # Increased from 2048 for CI stability

  # Define constant for each job to use
  GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

  # Setup ccache environment variables
  CCACHE_DEBUG: 1
  CCACHE_VERBOSE: 1
  CCACHE_MAXSIZE: 5G
  CCACHE_BASEDIR: ${{ github.workspace }}

on:
  push:
    tags:
      - '**'
  pull_request:
    branches:
      - "**" # https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#patterns-to-match-branches-and-tags

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      enable_tmate:
        description: 'Enable tmate SSH session on failure'
        type: boolean
        default: false

jobs:
  set_build_datetime:
    name: Set Build Datetime
    runs-on: ubuntu-24.04
    steps:
      - name: Set Build Datetime
        id: set_date
        run: |
          echo "build_datetime=$(date +'%Y-%m-%d %H_%M_%S')" >> $GITHUB_OUTPUT

      # Docs-only PRs skip the heavy jobs; a skipped job counts as passing for
      # required checks. Evaluated over the whole PR diff, so a code change
      # added later brings everything back. Tags and manual runs always build.
      - name: Detect docs-only PR
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code_changed=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename')
            echo "$files" | grep -qvE '^docs/|\.md$' || code_changed=false
          fi
          echo "code_changed=$code_changed" | tee -a $GITHUB_OUTPUT
    outputs:
      build_datetime: ${{ steps.set_date.outputs.build_datetime }}
      code_changed: ${{ steps.changes.outputs.code_changed }}

  safety_checks:
    name: Safety Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # For PRs, checkout the actual PR head commit, not the merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            android/app/src/main/res/menu/main.xml
            scripts/check_dev_page_hidden.sh

      - name: Ensure dev page is not exposed
        run: |
          chmod +x ./scripts/check_dev_page_hidden.sh
          ./scripts/check_dev_page_hidden.sh

  # The build is two jobs, not one 2-arch matrix, so the emulator tests (which
  # only need the x86_64 APKs) can start as soon as x86_64 is built instead of
  # waiting for arm64 too. Each keeps a one-entry matrix so ${{ matrix.arch }}
  # and the check names ("Build Android App (x86_64)" / "(arm64-v8a)") are
  # unchanged; build-arm64 reuses this job's env, outputs and steps via YAML
  # anchors, so edit them here.
  build-x86_64:
    name: Build Android App
    needs: [set_build_datetime, safety_checks]
    if: needs.set_build_datetime.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [x86_64]
      fail-fast: false
    env: &build-env
      ENTRY_FILE: "index.tsx"
      GRADLE_ABI: ${{ matrix.arch }}
      BUILD_ARCH: ${{ matrix.arch }}
    timeout-minutes: 40  # Increased for cache rebuilds after dependency updates
    outputs: &build-outputs
      repository_name: ${{ steps.set_repo.outputs.repository_name }}

    steps: &build-steps
    - uses: actions/checkout@v7
      with:
        # For PRs, checkout the actual PR head commit, not the merge commit
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 1

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        create-symlink: true
        # PRs restore master's ccache; only master saves (see Update Caches)
        save: ${{ github.ref == 'refs/heads/master' }}

    # Set repository name as env variable
    - name: Set repository name as env variable
      id: set_repo
      run: |
        echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV
        echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_OUTPUT

    - name: Common Setup
      id: common-setup
      uses: ./.github/actions/common-setup
      with:
        gradle_max_workers: "4"
        node_version: "22.x"
        arch: ${{ matrix.arch }}
        # Overlap bundling (~0.6m when JS changed) with the cache restores and
        # codegen; Gradle only needs it when it packages the APK
        js_bundle_in_background: "true"

    - name: Ccachify the Native Modules
      shell: bash
      run: |
        chmod +x scripts/ccachify_native_modules.sh
        ./scripts/ccachify_native_modules.sh

    - name: Wait for the background JS bundle
      if: steps.common-setup.outputs.js-bundle-cache-hit != 'true'
      run: ./scripts/wait_for_js_bundle.sh

    # Debug always; release too unless this is a pull request (see BUILD_RELEASE)
    - name: Build Android APKs with Gradle
      run: |
        echo "Building for architecture: $BUILD_ARCH (release: $BUILD_RELEASE)"
        tasks=(
          ":${{ env.main_project_module }}:assemble${VARIANT_ARCH}Debug"
          ":${{ env.main_project_module }}:assemble${VARIANT_ARCH}DebugAndroidTest"
        )
        if [ "$BUILD_RELEASE" = "true" ]; then
          tasks+=(
            ":${{ env.main_project_module }}:assemble${VARIANT_ARCH}Release"
            ":${{ env.main_project_module }}:bundle${VARIANT_ARCH}Release"
          )
        fi
        cd android && \
        # Pass BUILD_ARCH directly to Gradle process to ensure it's available during configuration
        ./gradlew -PBUILD_ARCH="${BUILD_ARCH}" \
                  -PreactNativeArchitectures="${BUILD_ARCH}" \
                  "${tasks[@]}" \
        --parallel --max-workers=$MAX_WORKERS --build-cache

      env:
        # Explicitly set BUILD_ARCH for Gradle process
        BUILD_ARCH: ${{ matrix.arch }}
        VARIANT_ARCH: ${{ matrix.arch == 'arm64-v8a' && 'Arm64V8a' || 'X8664' }}

    - name: Setup tmate session
      if: ${{ failure() && inputs.enable_tmate == true }}
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true

    # Release isn't built on PRs, but the restored build-outputs cache (saved by
    # cache warming, which builds release) can still hold a release APK/AAB from
    # another commit. Drop them so a stale release never reaches the artifacts.
    - name: Remove stale release outputs
      if: env.BUILD_RELEASE != 'true'
      run: rm -rf android/${{ env.main_project_module }}/build/outputs/apk/*/release android/${{ env.main_project_module }}/build/outputs/bundle

    # Save the build artifacts to be used in other jobs
    - name: List APKs before upload
      run: |
        echo "Available APKs in build directory:"
        find android/${{ env.main_project_module }}/build/outputs/apk/ -type f -name "*.apk" | sort

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v7
      with:
        name: android-apk-artifacts-${{ matrix.arch }}
        path: |
          android/${{ env.main_project_module }}/build/outputs/apk/${{ matrix.arch == 'arm64-v8a' && 'arm64v8a' || 'x8664' }}/debug/*-debug.apk
          android/${{ env.main_project_module }}/build/outputs/apk/${{ matrix.arch == 'arm64-v8a' && 'arm64v8a' || 'x8664' }}/release/*-release-unsigned.apk
        retention-days: 1
        if-no-files-found: error

    # Save the test APKs separately
    - name: Upload Test APK artifacts
      uses: actions/upload-artifact@v7
      with:
        name: android-test-apk-artifacts-${{ matrix.arch }}
        path: android/${{ env.main_project_module }}/build/outputs/apk/androidTest/${{ matrix.arch == 'arm64-v8a' && 'arm64v8a' || 'x8664' }}/debug/
        retention-days: 1
        if-no-files-found: error

    # Save the build artifacts to be used in other jobs
    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: android-coverage-artifacts-${{ matrix.arch }}
        path: |
          android/${{ env.main_project_module }}/build/intermediates/classes
          android/${{ env.main_project_module }}/build/intermediates/javac
          android/${{ env.main_project_module }}/build/tmp/kotlin-classes
        retention-days: 1
        if-no-files-found: error

    - name: Upload Bundle artifacts
      if: env.BUILD_RELEASE == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: android-bundle-artifacts-${{ matrix.arch }}
        path: android/${{ env.main_project_module }}/build/outputs/bundle/
        retention-days: 1
        if-no-files-found: error

    # Update all caches (skip saves for caches that were already hit).
    # Master only: PR runs restore master's caches (kept warm by cache-warming.yml
    # on every merge), and PR-scoped saves bought nothing -- later pushes to a PR
    # built no faster than first pushes (median 9.6m both) -- while adding ~1.3m
    # to the build job and churning the 100GB cache budget.
    - name: Update Caches
      if: always() && github.ref == 'refs/heads/master'
      uses: ./.github/actions/cache-update
      with:
        arch: ${{ matrix.arch }}
        yarn-cache-hit: ${{ steps.common-setup.outputs.yarn-cache-hit }}
        yarn-install-state-cache-hit: ${{ steps.common-setup.outputs.yarn-install-state-cache-hit }}
        js-bundle-cache-hit: ${{ steps.common-setup.outputs.js-bundle-cache-hit }}
        js-bundle-cache-key: ${{ steps.common-setup.outputs.js-bundle-cache-key }}
        gradle-deps-cache-hit: ${{ steps.common-setup.outputs.gradle-deps-cache-hit }}
        gradle-cache-hit: ${{ steps.common-setup.outputs.gradle-cache-hit }}
        build-outputs-cache-hit: ${{ steps.common-setup.outputs.build-outputs-cache-hit }}
        react-native-cache-hit: ${{ steps.common-setup.outputs.react-native-cache-hit }}

  build-arm64:
    name: Build Android App
    needs: [set_build_datetime, safety_checks]
    if: needs.set_build_datetime.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [arm64-v8a]
      fail-fast: false
    env: *build-env
    timeout-minutes: 40  # Increased for cache rebuilds after dependency updates
    outputs: *build-outputs
    steps: *build-steps

  sign:
    name: Sign Android APKs and Bundles (${{ matrix.arch }})
    needs: [set_build_datetime, build-x86_64, build-arm64]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [arm64-v8a, x86_64]
    env:
      ENTRY_FILE: "index.tsx"
      GRADLE_ABI: ${{ matrix.arch }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # For PRs, checkout the actual PR head commit, not the merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      # Import build variables from build job
      - name: Set build variables
        run: |
          echo "repository_name=${{ needs.build-x86_64.outputs.repository_name }}" >> $GITHUB_ENV

      # Download build artifacts for current architecture
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-apk-artifacts-${{ matrix.arch }}
          path: artifacts/apk/

      - name: Download Bundle artifacts
        if: env.BUILD_RELEASE == 'true'
        uses: actions/download-artifact@v8
        with:
          name: android-bundle-artifacts-${{ matrix.arch }}
          path: artifacts/bundle/

      # Prepare directory structure for signing
      - name: Prepare directories for signing
        run: |
          mkdir -p signing/apk/debug
          mkdir -p signing/apk/release
          mkdir -p signing/bundle/release

          # Organize APKs by type
          find artifacts/apk/ -path "*/debug/*" -name "*.apk" -exec cp {} signing/apk/debug/ \;
          find artifacts/apk/ -path "*/release/*" -name "*.apk" -exec cp {} signing/apk/release/ \;
          # No bundle artifact on PRs (release isn't built there)
          if [ -d artifacts/bundle ]; then
            find artifacts/bundle/ -name "*.aab" -exec cp {} signing/bundle/release/ \;
          fi

          # Verify contents
          echo "Files to sign:"
          find signing -type f | sort

      # Sign the APKs and AAB
      - name: Sign debug app APKs
        run: scripts/sign_android_artifacts.sh signing/apk/debug
        env:
          SIGNING_KEY_BASE64: ${{ secrets.DEBUG_SIGNING_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.DEBUG_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_ALIAS_PASS }}
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}

      - name: Sign RELEASE app APKs
        if: env.BUILD_RELEASE == 'true'
        run: scripts/sign_android_artifacts.sh signing/apk/release
        env:
          SIGNING_KEY_BASE64: ${{ secrets.RELEASE_SIGNING_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_ALIAS_PASS }}
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}

      - name: Sign RELEASE app AABs
        if: env.BUILD_RELEASE == 'true'
        run: scripts/sign_android_artifacts.sh signing/bundle/release
        env:
          SIGNING_KEY_BASE64: ${{ secrets.RELEASE_SIGNING_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_ALIAS_PASS }}
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}

      # Rename APKs
      - name: Rename and organize signed artifacts
        run: |
          mkdir -p renamed_apks

          sanitize_branch_name() {
            echo "$1" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-20
          }

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # For tags
            VERSION=${GITHUB_REF#refs/tags/v}
            SUFFIX="-${VERSION}"
          elif [[ $GITHUB_REF == refs/pull/* ]]; then
            # For pull requests - use actual PR head SHA, not merge commit SHA
            PR_NUMBER=$(echo $GITHUB_REF | awk 'BEGIN { FS = "/" } ; { print $3 }')
            BRANCH_NAME=$(sanitize_branch_name "$GITHUB_HEAD_REF")
            SHORT_SHA=$(echo $PR_HEAD_SHA | cut -c1-7)
            SUFFIX="-pr-${PR_NUMBER}-${BRANCH_NAME}-${SHORT_SHA}"
          else
            # For pushes to branches other than main
            BRANCH_NAME=$(sanitize_branch_name "${GITHUB_REF#refs/heads/}")
            SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
            SUFFIX="-${BRANCH_NAME}-${SHORT_SHA}"
          fi

          # Find and rename signed debug APKs
          find signing/apk/debug/ -name "*-signed.apk" | while read apk; do
            cp "$apk" renamed_apks/${{env.app_file_name_prefix}}${SUFFIX}-${{ matrix.arch }}-debug.apk
          done

          # Find and rename signed release APKs
          find signing/apk/release/ -name "*-signed.apk" | while read apk; do
            cp "$apk" renamed_apks/${{env.app_file_name_prefix}}${SUFFIX}-${{ matrix.arch }}-release.apk
          done

          # Find and rename signed AABs
          find signing/bundle/release/ -name "*-signed.aab" | while read aab; do
            cp "$aab" renamed_apks/${{env.app_file_name_prefix}}${SUFFIX}-${{ matrix.arch }}.aab
          done

          # List all renamed files
          echo "Renamed files:"
          ls -la renamed_apks/
        env:
          # For PRs, this is the actual PR head commit; for other events it's empty (not used)
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # Upload signed artifacts
      - name: Upload SIGNED APK Debug
        uses: actions/upload-artifact@v7
        with:
          name: "signed-${{ needs.set_build_datetime.outputs.build_datetime }}-${{ env.app_name }}-APK-debug-${{ matrix.arch }}"
          path: renamed_apks/${{env.app_file_name_prefix}}-*-debug.apk

      - name: Upload SIGNED APK RELEASE
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: "signed-${{ needs.set_build_datetime.outputs.build_datetime }}-${{ env.app_name }}-APK-release-${{ matrix.arch }}"
          path: renamed_apks/${{env.app_file_name_prefix}}-*-release.apk

      - name: Upload SIGNED AAB (App Bundle) Release
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: "signed-${{ needs.set_build_datetime.outputs.build_datetime }}-${{ env.app_name }}-AAB-release-${{ matrix.arch }}"
          path: renamed_apks/${{env.app_file_name_prefix}}-*.aab

  comment-pr:
    name: Comment on PR with build links
    if: github.event_name == 'pull_request'
    needs: sign
    runs-on: ubuntu-24.04
    steps:
      - name: Comment PR
        uses: actions/github-script@v9
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const workflowUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Use the actual PR head commit SHA, not the merge commit SHA
            const commitSha = context.payload.pull_request.head.sha;
            const shortSha = commitSha.substring(0, 7);
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commitSha}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Build artifacts for PR #${context.issue.number} (commit [\`${shortSha}\`](${commitUrl})) are available:

              - [Debug APKs (arm64-v8a, x86_64)](${workflowUrl}#artifacts)
              Release APKs and AABs are built for tagged releases only.

              You can download these artifacts from the "Artifacts" section of the workflow run.`
            });

  # Jest (TypeScript/JavaScript) tests, split out of unit-tests: they need only
  # Node and node_modules, and running them in parallel takes ~0.3m off the
  # unit-tests job, which gates the required CI Result check.
  jest-tests:
    name: Run Jest Tests
    runs-on: ubuntu-24.04
    needs: set_build_datetime
    if: needs.set_build_datetime.outputs.code_changed == 'true'
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        # For PRs, checkout the actual PR head commit, not the merge commit
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 1

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: "22.x"
        cache: "yarn"

    - name: Install dependencies
      run: yarn install --immutable --inline-builds
      env:
        YARN_ENABLE_GLOBAL_CACHE: 'false'
        YARN_NM_MODE: 'hardlinks-local'
        HUSKY: '0'

    # Run Jest tests (TypeScript/JavaScript unit tests) with coverage
    - name: Run Jest Tests
      run: yarn test --ci --coverage --reporters=default --reporters=jest-junit
      env:
        JEST_JUNIT_OUTPUT_DIR: ./jest-results
        JEST_JUNIT_OUTPUT_NAME: jest-results.xml

    # Publish Jest test results
    - name: Publish Jest Test Results
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: 'Jest Tests'
        path: 'jest-results/jest-results.xml'
        reporter: jest-junit
        fail-on-error: true

    # Upload Jest coverage report
    - name: Upload Jest Coverage Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jest-coverage-report-${{ needs.set_build_datetime.outputs.build_datetime }}
        path: coverage/
        retention-days: 90

  # Unit tests split across UNIT_TEST_SHARDS jobs by test-class hash (see
  # unitTestShardCount in app/build.gradle). Each shard uploads its results,
  # coverage data and compiled classes; merge-unit-test-coverage builds the
  # reports. Each job pays ~4.3m of fixed setup/config/compile, so 2 shards:
  # the unit tests then finish around when build + sign do.
  unit-tests:
    name: Unit Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: set_build_datetime
    if: needs.set_build_datetime.outputs.code_changed == 'true'
    timeout-minutes: 25  # Increased for cache rebuilds after dependency updates
    strategy:
      matrix:
        arch: [x86_64] # Only test on x86_64 to save time and resources
        shard: [0, 1, 2]  # keep in step with UNIT_TEST_SHARDS
      fail-fast: false
    env:
      UNIT_TEST_SHARDS: 3
    steps:
    - uses: actions/checkout@v7
      with:
        # For PRs, checkout the actual PR head commit, not the merge commit
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 1

    # No ccache here: the unit-test run passes -Pandroid.externalNativeBuild.skip=true
    # (since #76), so nothing native is compiled. `ccache -s` showed zero
    # compiler calls on both warm and cold (Sept 2026, cache warmer down) runs.

    # Execute the common setup
    # Skip disk cleanup - unit tests are pure Kotlin/Java, don't use emulator
    # Skip the JS bundle - Robolectric never packages an APK
    # Note: codegen IS needed because native modules depend on generated React Native specs
    - name: Common Setup
      uses: ./.github/actions/common-setup
      with:
        optional_cache_key: "unit-tests"
        gradle_max_workers: "4"
        node_version: "22.x"
        arch: ${{ matrix.arch }}
        skip_disk_space: "true"
        skip_js_bundle: "true"

    # Run the unit tests
    - name: Run Unit Tests
      run: |
        cd android && \
        ./gradlew -PBUILD_ARCH="${{ matrix.arch }}" \
                  -PreactNativeArchitectures="${{ matrix.arch }}" \
                  :${{ env.main_project_module }}:generatePackageList \
                  :${{ env.main_project_module }}:test${{ matrix.arch == 'arm64-v8a' && 'Arm64V8a' || 'X8664' }}DebugUnitTest \
                  -PunitTestShardCount=$UNIT_TEST_SHARDS \
                  -PunitTestShardIndex=${{ matrix.shard }} \
        --continue \
        -Pandroid.externalNativeBuild.skip=true \
        -x preBuild -x preDebugBuild -x preReleaseBuild
      env:
        BUILD_ARCH: ${{ matrix.arch }}

    # Publish test results using dorny/test-reporter
    - name: Publish Unit Test Results
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: 'Unit Tests (shard ${{ matrix.shard }})'
        path: 'android/${{ env.main_project_module }}/build/test-results/test*DebugUnitTest/**/*.xml'
        reporter: java-junit
        use-actions-summary: 'true'
        fail-on-error: true

    # Results, coverage data and compiled classes for merge-unit-test-coverage
    - name: Upload Unit Test Shard
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: unit-test-shard-${{ matrix.shard }}
        path: |
          android/app/build/test-results/
          android/app/build/reports/tests/
          android/app/build/outputs/unit_test_code_coverage/
          android/app/build/tmp/kotlin-classes/x8664Debug/
          android/app/build/intermediates/javac/x8664Debug/
        retention-days: 1
        if-no-files-found: error

  # Builds the two unit-test coverage reports the old single job produced, from
  # the shards' coverage data, with JaCoCo's CLI (as merge-integration-coverage
  # does) -- same class filters, output paths and artifact name, so
  # coverage-report and test-summary.yml are unchanged:
  #   reports/coverage/test/x8664/debug   AGP's report (read by the PR comment)
  #   reports/jacoco/unitTestCoverage     jacocoUnitTestReport's (also excludes
  #                                       *Test* and com/facebook/react)
  merge-unit-test-coverage:
    name: Merge Unit Test Coverage
    needs: [set_build_datetime, unit-tests]
    runs-on: ubuntu-24.04
    if: always() && needs.unit-tests.result != 'cancelled' && needs.set_build_datetime.outputs.code_changed == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Download unit test shards
        uses: actions/download-artifact@v8
        with:
          pattern: unit-test-shard-*
          path: shards/

      - name: Generate merged unit test coverage reports
        run: ./scripts/merge_unit_test_coverage.sh shards

      - name: Upload Unit Test Results and Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-and-coverage-${{ needs.set_build_datetime.outputs.build_datetime }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 90

  # connected-android-integration-test:
